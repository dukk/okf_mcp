<style>
/* ---------- tokens: Notion-like neutrals ---------- */
:root {
  --bg: #ffffff; --bg-2: #f7f7f5; --bg-3: #efefed; --text: #37352f; --muted: #787774;
  --faint: #a5a29a; --line: #e9e9e7; --accent: #2383e2; --accent-soft: #e7f3fe;
  --green: #448361; --green-soft: #edf3ec; --red: #d44c47; --red-soft: #fdebec;
  --amber: #cb912f; --amber-soft: #fbf3db; --purple: #9065b0; --purple-soft: #f4f0f7;
  --radius: 10px; --tab-h: 58px;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: Literata, Georgia, "Iowan Old Style", serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
  --bg: #191919; --bg-2: #202020; --bg-3: #2a2a2a; --text: #e3e2e0; --muted: #9b9a97;
  --faint: #6f6e69; --line: #2f2f2f; --accent: #529cca; --accent-soft: #1f2e3a;
  --green: #4dab9a; --green-soft: #1e2e2a; --red: #df5452; --red-soft: #3a1f1f;
  --amber: #d9a443; --amber-soft: #352d1c; --purple: #9a6dd7; --purple-soft: #2b2333; } }
:root[data-theme=dark] {
  --bg: #191919; --bg-2: #202020; --bg-3: #2a2a2a; --text: #e3e2e0; --muted: #9b9a97;
  --faint: #6f6e69; --line: #2f2f2f; --accent: #529cca; --accent-soft: #1f2e3a;
  --green: #4dab9a; --green-soft: #1e2e2a; --red: #df5452; --red-soft: #3a1f1f;
  --amber: #d9a443; --amber-soft: #352d1c; --purple: #9a6dd7; --purple-soft: #2b2333; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
a { color: inherit; text-decoration: none; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- mockup controls (not part of the design) ---------- */
.mk-btn { position: fixed; z-index: 60; left: 10px; bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom)); font: 600 12px var(--sans); border: 0; background: #2383e2; color: #fff; padding: 8px 12px; border-radius: 999px; box-shadow: 0 4px 14px #0005; }
.mk { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: #1c1c1e; color: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px #0008; display: none; }
.mk.open { display: block; }
.mk .lbl { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .04em; color: #999; margin: 10px 0 6px; }
.mk .row { display: flex; gap: 6px; flex-wrap: wrap; }
.mk button { font: 600 14px var(--sans); border: 1px solid #333; background: #2a2a2c; color: #fff; padding: 9px 14px; border-radius: 10px; }
.mk button[aria-pressed=true] { background: #2383e2; border-color: #2383e2; }
.mk-scrim { position: fixed; inset: 0; z-index: 60; background: #0006; display: none; }
.mk-scrim.open { display: block; }

/* ---------- app frame ---------- */
.app { min-height: 100dvh; padding: env(safe-area-inset-top) 0 calc(var(--tab-h) + env(safe-area-inset-bottom)); }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.catalog { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.catalog .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.catalog svg { width: 16px; height: 16px; color: var(--muted); }
.top .sp { flex: 1; }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--faint); }
.tabs a svg { width: 22px; height: 22px; }
.tabs a.on { color: var(--text); }
.wrap { padding: 4px 16px 24px; max-width: 680px; margin: 0 auto; }
.search { display: flex; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 10px; padding: 10px 12px; color: var(--muted); font-size: 15px; }
.search svg { width: 18px; height: 18px; }
.search .k { margin-left: auto; font-size: 12px; color: var(--faint); }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 6px; }
.sec h2 { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin: 0; }
.sec a { font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 6px; border-radius: 8px; min-height: 48px; }
.row:active { background: var(--bg-2); }
.row .ic { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); background: var(--bg-2); flex: none; }
.row .ic svg { width: 17px; height: 17px; }
.row .t { font-weight: 500; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx { min-width: 0; flex: 1; }
.row .r { font-size: 12px; color: var(--faint); flex: none; }
.chev { color: var(--faint); width: 16px !important; height: 16px !important; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg-3); color: var(--muted); }
.pill.g { background: var(--green-soft); color: var(--green); } .pill.r { background: var(--red-soft); color: var(--red); }
.pill.a { background: var(--amber-soft); color: var(--amber); } .pill.p { background: var(--purple-soft); color: var(--purple); }
.pill.b { background: var(--accent-soft); color: var(--accent); }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin: 10px 2px 2px; flex-wrap: wrap; }
.crumbs svg { width: 13px; height: 13px; color: var(--faint); }
h1.page { font-size: 28px; line-height: 1.2; font-weight: 700; margin: 6px 0 6px; letter-spacing: -.01em; }
.lede { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 14px; font-size: 13px; color: var(--muted); }
.card { background: var(--bg-2); border-radius: 12px; padding: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fcard { background: var(--bg-2); border-radius: 12px; padding: 12px; min-height: 96px; display: flex; flex-direction: column; gap: 6px; }
.fcard .h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.fcard .h svg { width: 18px; height: 18px; color: var(--amber); }
.fcard .d { font-size: 12.5px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fcard .n { font-size: 12px; color: var(--faint); margin-top: auto; }
.toggle { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 6px; padding-bottom: 2px; }
.toggle span { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--bg-2); color: var(--muted); white-space: nowrap; }
.toggle span.on { background: var(--text); color: var(--bg); }
.group { margin: 16px 0 4px; }
.group .gh { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
.group .gh .who { font-size: 14px; } .group .gh .who b { font-weight: 600; }
.group .gh .when { margin-left: auto; font-size: 12px; color: var(--faint); }
.group .items { margin-left: 17px; padding-left: 21px; border-left: 2px solid var(--line); }
.day { font-size: 13px; font-weight: 600; color: var(--text); margin: 20px 4px 2px; }
.more { font-size: 13px; color: var(--accent); padding: 6px 6px; }
/* concept */
.body { font-size: 16px; line-height: 1.65; }
.body.serif { font-family: var(--serif); font-size: 17.5px; line-height: 1.7; }
.body h2 { font-family: var(--sans); font-size: 20px; margin: 26px 0 6px; letter-spacing: -.01em; }
.body p { margin: 0 0 14px; }
.body code { font: 13.5px var(--mono); background: var(--bg-3); padding: 1px 5px; border-radius: 4px; }
.body a { color: var(--text); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.body blockquote { margin: 0 0 14px; padding: 10px 14px; border-radius: 8px; background: var(--bg-2); color: var(--muted); font-size: 15px; display: flex; gap: 10px; }
.body blockquote svg { width: 18px; height: 18px; margin-top: 2px; color: var(--accent); }
.body ul { padding-left: 20px; margin: 0 0 14px; } .body li { margin: 3px 0; }
.toc { border: 1px solid var(--line); border-radius: 10px; margin: 6px 0 16px; }
.toc summary { list-style: none; padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.toc summary::-webkit-details-marker { display: none; }
.toc ol { margin: 0; padding: 0 12px 10px 32px; font-size: 14px; color: var(--muted); } .toc li { padding: 4px 0; }
.backlink { display: flex; align-items: center; gap: 10px; padding: 8px 4px; }
.backlink .n { margin-left: auto; font-size: 12px; color: var(--faint); }
.otp { position: fixed; right: 14px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom)); z-index: 4; display: flex; align-items: center; gap: 6px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px #0004; }
.otp svg { width: 16px; height: 16px; }
.note { font-size: 12px; color: var(--faint); text-align: center; margin: 18px 0 0; }
[hidden] { display: none !important; }
</style>
</head>

<template id="pages-concept"><div class="wrap">
  <div class="crumbs">Infrastructure<svg><use href="#i-chev"/></svg>Kubernetes cluster</div>
  <h1 class="page">Kubernetes cluster</h1>
  <div class="meta"><span class="pill p">system</span><span class="pill">k8s</span><span class="pill">infra</span><span>· Edited 1 h ago</span></div>
  <details class="toc"><summary><svg><use href="#i-list"/></svg>On this page · 6 sections<svg class="chev" style="margin-left:auto"><use href="#i-down"/></svg></summary><ol><li>Nodes</li><li>Argo CD</li><li>Ingress</li><li>Certificates</li><li>Upgrades</li><li>Incidents</li></ol></details>
  <div class="body">
    <blockquote><svg><use href="#i-info"/></svg><span>This is the home cluster. Production runs separately: see <a>Production deployment</a>.</span></blockquote>
    <p>The cluster runs three control-plane nodes and five workers. Workloads are deployed by <a>Argo CD</a> from the <code>infra</code> repository, and ingress terminates at the edge routers.</p>
    <h2>Nodes</h2>
    <p>Each node is a VM on the rack hosts. Upgrades go one node at a time with <code>kubectl drain</code> first.</p>
    <h2>Argo CD</h2>
    <p>Every application is synced from git. The image updater commits new tags back, so a merge to <code>main</code> rolls out on its own.</p>
  </div>
  <div class="sec"><h2>Linked from · 4</h2></div>
  <a class="backlink"><span class="ic" style="width:26px;height:26px"><svg style="width:15px;height:15px"><use href="#i-doc"/></svg></span>Production deployment<span class="n">3 links</span></a>
  <a class="backlink"><span class="ic" style="width:26px;height:26px"><svg style="width:15px;height:15px"><use href="#i-doc"/></svg></span>Image updater</a>
  <a class="backlink"><span class="ic" style="width:26px;height:26px"><svg style="width:15px;height:15px"><use href="#i-log"/></svg></span>Log<span class="n">6 entries</span></a>
</div></template>

<script>
const state = { dir: 'pages', screen: 'home' };
try { Object.assign(state, JSON.parse(localStorage.getItem('mk') || '{}')); } catch {}
if (!['pages', 'reader', 'activity'].includes(state.dir)) state.dir = 'pages';
const app = document.getElementById('app');
const tpl = id => document.getElementById(id).content.cloneNode(true);
function render() {
  try { localStorage.setItem('mk', JSON.stringify(state)); } catch {}
  app.replaceChildren();
  app.append(tpl('top'), tpl(`${state.dir}-${state.screen}`), tpl('tabs'));
  const on = { home: 'home', folder: 'folder', concept: 'folder' }[state.screen];
  app.querySelector(`.tabs a[data-t=${on}]`)?.classList.add('on');
  for (const b of document.querySelectorAll('#mk-dir button')) b.setAttribute('aria-pressed', b.dataset.dir === state.dir);
  for (const b of document.querySelectorAll('#mk-screen button')) b.setAttribute('aria-pressed', b.dataset.screen === state.screen);
  window.scrollTo(0, 0);
}
document.getElementById('mk-dir').onclick = e => { if (e.target.dataset.dir) { state.dir = e.target.dataset.dir; render(); openPanel(false); } };
document.getElementById('mk-screen').onclick = e => { if (e.target.dataset.screen) { state.screen = e.target.dataset.screen; render(); openPanel(false); } };
app.addEventListener('click', e => { const t = e.target.closest('.tabs a'); if (t && ['home','folder'].includes(t.dataset.t)) { state.screen = t.dataset.t; render(); } });
document.getElementById('mk-theme').onclick = () => {
  const r = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = r.dataset.theme || (dark ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};
document.getElementById('mk-fs').onclick = () => { document.documentElement.requestFullscreen?.().catch(() => {}); openPanel(false); };
const panel = document.getElementById('mk'), scrim = document.getElementById('mk-scrim');
const openPanel = on => { panel.classList.toggle('open', on); scrim.classList.toggle('open', on); };
document.getElementById('mk-open').onclick = () => openPanel(true);
document.getElementById('mk-close').onclick = () => openPanel(false);
scrim.onclick = () => openPanel(false);
addEventListener('scroll', () => document.querySelector('.top')?.classList.toggle('scrolled', scrollY > 4), { passive: true });
render();
</script>
